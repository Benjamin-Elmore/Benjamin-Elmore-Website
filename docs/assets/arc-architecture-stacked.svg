<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 616" role="img" aria-labelledby="arcs-title arcs-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="arcs-title">ARC intended system architecture</title>
  <desc id="arcs-desc">Intended system architecture, top to bottom: optical and other external sensors connect over I²C to an I²C multiplexer; the multiplexed I²C bus connects over I²C to the ESP32-S3 running ARC firmware on the ARSENAL board, marked as the subject of this case study; the ESP32-S3 exchanges data with the VEX V5 Brain, the robot controller, over a bidirectional half-duplex RS-485 link.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4b4b4"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="358" height="614" rx="20" fill="#1e1e1e" stroke="#717171" stroke-width="2"/>
  <text x="24" y="44" font-size="20" font-weight="700" fill="#ffffff">Intended system architecture</text>

  <!-- Links -->
  <g stroke="#b4b4b4" stroke-width="3" fill="none">
    <line x1="150" y1="162" x2="150" y2="213" marker-end="url(#arrow)"/>
    <line x1="150" y1="306" x2="150" y2="357" marker-end="url(#arrow)"/>
    <line x1="150" y1="453" x2="150" y2="501" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g font-size="17" fill="#ededed">
    <text x="170" y="194">I²C</text>
    <text x="170" y="338">I²C</text>
    <text x="170" y="482">half-duplex RS-485</text>
  </g>

  <!-- Blocks -->
  <g stroke-width="3" fill="#333333">
    <rect x="24" y="72" width="312" height="88" rx="12" stroke="#b4b4b4"/>
    <rect x="24" y="216" width="312" height="88" rx="12" stroke="#b4b4b4"/>
    <rect x="24" y="360" width="312" height="88" rx="12" stroke="#f2f0eb"/>
    <rect x="24" y="504" width="312" height="88" rx="12" stroke="#b4b4b4"/>
  </g>
  <rect x="222" y="374" width="100" height="28" rx="14" fill="#f2f0eb"/>
  <text x="272" y="394" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="middle">case study</text>

  <g font-size="22" font-weight="700" fill="#ffffff">
    <text x="42" y="108">Sensors</text>
    <text x="42" y="252">I²C mux</text>
    <text x="42" y="396">ESP32-S3</text>
    <text x="42" y="540">VEX V5 Brain</text>
  </g>
  <g font-size="17" fill="#d6e2f3">
    <text x="42" y="138">optical and other external sensors</text>
    <text x="42" y="282">multiplexed I²C</text>
    <text x="42" y="426">ARC firmware on ARSENAL board</text>
    <text x="42" y="570">robot controller</text>
  </g>
</svg>
