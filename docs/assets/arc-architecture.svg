<rect x="398" y="130" width="18" height="12" fill="none" stroke="#ffffff" stroke-width="1"/><rect x="394" y="132" width="8" height="3" fill="#000" stroke="#ffffff" stroke-width="1"/><rect x="394" y="137" width="8" height="3" fill="#000" stroke="#ffffff" stroke-width="1"/>
<text x="284" y="154" font-size="18">I²C Mux</text>
<text x="284" y="192" font-size="15">Channel select</text>
<text x="284" y="214" font-size="15">Multiplexed I²C</text>
