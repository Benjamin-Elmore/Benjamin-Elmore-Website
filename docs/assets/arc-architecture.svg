<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="arc-title arc-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="arc-title">ARC intended system architecture</title>
  <desc id="arc-desc">Intended system architecture, left to right: optical and other external sensors connect over I²C to an I²C multiplexer; the multiplexed I²C bus connects over I²C to the ESP32-S3 running ARC firmware on the ARSENAL board, marked as the subject of this case study; the ESP32-S3 exchanges data with the VEX V5 Brain, the robot controller, over a bidirectional half-duplex RS-485 link.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fbcff"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="358" rx="20" fill="#0b1f3a" stroke="#4a78b5" stroke-width="2"/>
  <text x="28" y="56" font-size="30" font-weight="700" fill="#ffffff">Intended system architecture</text>

  <!-- Links -->
  <g stroke="#8fbcff" stroke-width="3" fill="none">
    <line x1="204" y1="228" x2="239" y2="228" marker-end="url(#arrow)"/>
    <line x1="410" y1="228" x2="445" y2="228" marker-end="url(#arrow)"/>
    <line x1="639" y1="228" x2="763" y2="228" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g font-size="22" fill="#e8eef8" text-anchor="middle">
    <text x="222" y="214">I²C</text>
    <text x="428" y="214">I²C</text>
    <text x="701" y="214">half-duplex</text>
    <text x="701" y="258">RS-485</text>
  </g>

  <!-- Blocks -->
  <g stroke-width="3" fill="#13325e">
    <rect x="12" y="138" width="190" height="180" rx="12" stroke="#8fbcff"/>
    <rect x="242" y="138" width="166" height="180" rx="12" stroke="#8fbcff"/>
    <rect x="448" y="138" width="188" height="180" rx="12" stroke="#ffc857"/>
    <rect x="766" y="138" width="182" height="180" rx="12" stroke="#8fbcff"/>
  </g>
  <rect x="474" y="90" width="136" height="36" rx="18" fill="#ffc857"/>
  <text x="542" y="115.5" font-size="22" font-weight="700" fill="#0b1f3a" text-anchor="middle">case study</text>

  <g text-anchor="middle">
    <g font-size="26" font-weight="700" fill="#ffffff">
      <text x="107" y="196">Sensors</text>
      <text x="325" y="196">I²C mux</text>
      <text x="542" y="196">ESP32-S3</text>
      <text x="857" y="196">VEX V5 Brain</text>
    </g>
    <g font-size="22" fill="#d6e2f3">
      <text x="107" y="242">optical and other</text>
      <text x="107" y="270">external sensors</text>
      <text x="325" y="242">multiplexed I²C</text>
      <text x="542" y="242">ARC firmware on</text>
      <text x="542" y="270">ARSENAL board</text>
      <text x="857" y="242">robot controller</text>
    </g>
  </g>
</svg>
