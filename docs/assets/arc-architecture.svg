<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-labelledby="arc-title arc-desc"><title id="arc-title">ARC data path</title><desc id="arc-desc">Designed data path, left to right: I²C sensors (optical and other external sensors) connect over I²C to an I²C multiplexer for channel selection; the multiplexed bus connects over I²C to the ESP32-S3 running ARC firmware on the ARSENAL board with ESP-IDF and FreeRTOS, marked as the case study; the ESP32-S3 exchanges data with the V5 Brain, the robot controller, over a bidirectional half-duplex RS-485 link. Design intent; not yet verified end to end on hardware.</desc><rect width="1000" height="370" fill="#000000"/><g font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#ffffff">
<text x="500" y="46" font-size="26" font-weight="700" text-anchor="middle">ARC | Data Path</text>
<text x="500" y="76" font-size="16" font-weight="600" text-anchor="middle">Sensor acquisition to the V5 Brain</text>
<rect x="20" y="120" width="180" height="160" rx="6" fill="none" stroke="#ffffff" stroke-width="1.4"/>
