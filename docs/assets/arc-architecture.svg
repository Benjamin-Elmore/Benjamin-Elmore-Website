<rect x="948" y="130" width="18" height="12" fill="none" stroke="#ffffff" stroke-width="1"/><rect x="944" y="132" width="8" height="3" fill="#000" stroke="#ffffff" stroke-width="1"/><rect x="944" y="137" width="8" height="3" fill="#000" stroke="#ffffff" stroke-width="1"/>
<text x="814" y="154" font-size="18">V5 Brain</text>
