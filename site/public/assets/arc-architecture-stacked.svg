<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 750" width="360" height="750" role="img" aria-labelledby="arcs-title arcs-desc"><title id="arcs-title">ARC data path</title><desc id="arcs-desc">Designed data path, top to bottom: I²C sensors (optical and other external sensors) connect over I²C to an I²C multiplexer for channel selection; the multiplexed bus connects over I²C to the ESP32-S3 running ARC firmware on the ARSENAL board with ESP-IDF and FreeRTOS, marked as the case study; the ESP32-S3 exchanges data with the V5 Brain, the robot controller, over a bidirectional half-duplex RS-485 link. Read direction verified on the bench on November 10, 2026; not yet run on the robot.</desc><rect width="360" height="750" fill="#000000"/><g font-family="'IBM Plex Sans', system-ui, sans-serif" fill="#ffffff">
