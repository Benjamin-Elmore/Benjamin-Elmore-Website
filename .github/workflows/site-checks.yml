name: site-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: docs/ must match a fresh build
        run: |
          git status --porcelain -- docs
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "docs/ differs from a fresh build. Run 'npm run build' in site/ and commit the result."
            git --no-pager diff --stat -- docs
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/check_site.py
      - name: Click-through in headless Chrome
        run: node tools/clickthrough.mjs --browser "$(command -v google-chrome)" --profile "$RUNNER_TEMP/chrome-profile"
